name: ci

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq shellcheck > /dev/null
      - name: Checks
        run: bash bin/ci/check.sh

  macos-bash32:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checks (bash 3.2, as macOS ships it)
        run: /bin/bash bin/ci/check.sh

  plugin-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Validate marketplace and plugins
        run: |
          npx -y @anthropic-ai/claude-code plugin validate .
          npx -y @anthropic-ai/claude-code plugin validate plugins/econ-research
          npx -y @anthropic-ai/claude-code plugin validate plugins/dugri
